x-php: &php
    # the workers are the same app with another command, so all three run one image
    image: feed-import-php
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
        args:
            UID: '${HOST_UID:-1000}'
            GID: '${HOST_GID:-1000}'
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    restart: unless-stopped
    volumes:
        - .:/app
    depends_on:
        mysql:
            condition: service_healthy
        kafka:
            condition: service_healthy

services:
    php:
        <<: *php
        healthcheck:
            test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);"']
            interval: 5s
            timeout: 5s
            retries: 10

    importer:
        <<: *php
        command: php artisan queue:work --queue=feeds --max-time=3600
        # a stop lets a running import finish within its 300 s timeout instead of killing it after 10 s
        stop_grace_period: 330s

    # its own worker, so a backlog of imports does not hold back announcing their changes; one process keeps per-key order
    publisher:
        <<: *php
        command: php artisan queue:work --queue=publishing --max-time=3600
        # past the worker's default 60 s job timeout, so a stop does not leave a job reserved until retry_after
        stop_grace_period: 70s

    nginx:
        image: nginx:1.28-alpine
        restart: unless-stopped
        ports:
            - '127.0.0.1:${APP_PORT:-8084}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/app/public:ro
        depends_on:
            php:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: feed_import
            MYSQL_USER: feed
            MYSQL_PASSWORD: feed
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3311}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
            # the test database; the image only creates MYSQL_DATABASE
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
            interval: 5s
            timeout: 5s
            retries: 20

    kafka:
        image: apache/kafka:4.1.0
        restart: unless-stopped
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            # topics come from docker/kafka/create-topics.sh; a typo in a topic name fails instead of creating one
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
            # a consumer group forms at once instead of after the default 3 s
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_HEAP_OPTS: '-Xmx512m -Xms512m'
            # the image's default log dir is /tmp/kafka-logs, outside the volume
            KAFKA_LOG_DIRS: /var/lib/kafka/data
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1']
            interval: 10s
            timeout: 10s
            retries: 12

volumes:
    mysql-data:
    kafka-data:
